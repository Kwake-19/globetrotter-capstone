<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GlobeTrotter · Yaoundé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<header class="site-header" id="siteHeader"></header>

<main>
  <section class="hero">
    <div class="hero__inner">
      <p class="eyebrow">Yaoundé travel assistant</p>
      <h1>Discover restaurants, malls, hotels and more around Yaoundé.</h1>
      <p class="hero__sub">Search restaurants, ice cream stops, malls, attractions, hotels and petrol stations across the city, then build them into a shareable day-trip itinerary.</p>
      <div class="hero__ctas">
        <a class="btn btn-primary" href="/signup.html">Sign up</a>
        <a class="btn btn-outline" href="/login.html">Log in</a>
      </div>
    </div>
  </section>

  <section class="preview-section container">
    <h2>A few places you'll find</h2>
    <div class="preview-grid" id="previewGrid"></div>
  </section>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="/js/api.js"></script>
<script>
  GT.renderHeader({ variant: 'public', active: 'landing' });
  GT.renderFooter();

  const PREVIEW_PLACES = [
    { name: 'Seven Hills', category: 'restaurant', neighborhood: 'Elig-Essono', image: '/assets/images/seven-hills.jpg' },
    { name: 'PlaYce Yaounde', category: 'mall', neighborhood: 'Warda', image: '/assets/images/playce-yaounde.jpg' },
    { name: 'Hilton Yaounde', category: 'hotel', neighborhood: 'Centre-ville', image: '/assets/images/hilton-yaounde.jpg' },
    { name: 'Cameroon Reunification Monument', category: 'fun_place', neighborhood: 'Centre-ville', image: '/assets/images/reunification-monument.jpg' }
  ];

  const grid = document.getElementById('previewGrid');
  PREVIEW_PLACES.forEach((place) => {
    const card = document.createElement('div');
    card.className = 'preview-card';
    card.innerHTML = `
      ${GT.renderPlaceImage(place, 'preview-card__img')}
      <div class="preview-card__body">
        <div class="preview-card__name">${GT.escapeHtml(place.name)}</div>
        <div class="preview-card__meta">${GT.escapeHtml(GT.categoryLabel(place.category))} · ${GT.escapeHtml(place.neighborhood)}</div>
      </div>
    `;
    grid.appendChild(card);
  });
</script>
</body>
</html>
