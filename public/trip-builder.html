<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Build itinerary · GlobeTrotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<header class="site-header" id="siteHeader"></header>

<main>
  <div class="container">
    <div class="page-head">
      <h1>Build your itinerary</h1>
      <p>Add places from the left, then reorder and save your trip.</p>
    </div>

    <div class="builder-layout">
      <section class="builder-col">
        <h2>Add places</h2>
        <div class="search-row">
          <input id="searchInput" type="text" placeholder="Search places" />
          <button id="searchBtn" class="btn btn-primary btn-sm">Search</button>
        </div>
        <div class="chip-row" id="categoryChips">
          <button class="chip active" data-category="">All</button>
        </div>
        <div class="builder-search-grid" id="searchResults"></div>
      </section>

      <section class="builder-col">
        <h2 id="draftHeading">Your trip</h2>
        <div id="draftEmpty" class="empty-state hidden">
          Your draft trip is empty. <a href="/app.html">Browse places</a> to add some.
        </div>
        <div id="draftList" class="draft-list"></div>
        <div class="builder-footer">
          <input id="tripTitle" type="text" placeholder="Trip title, e.g. Saturday in Bastos" />
          <div id="builderMessage" class="field__error"></div>
          <button id="saveTripBtn" class="btn btn-primary btn-block">Save itinerary</button>
        </div>
      </section>
    </div>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="/js/api.js"></script>
<script src="/js/trip-builder.js"></script>
</body>
</html>
