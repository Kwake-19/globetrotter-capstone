<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browse places · GlobeTrotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<header class="site-header" id="siteHeader"></header>

<main>
  <div class="container">
    <div class="page-head">
      <h1>Browse Yaoundé</h1>
      <p>Search restaurants, ice cream stops, malls, attractions, hotels and petrol stations.</p>
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Search places, e.g. &quot;ice cream&quot; or &quot;Bastos&quot;" />
        <button id="searchBtn" class="btn btn-primary">Search</button>
      </div>
      <div class="chip-row" id="categoryChips">
        <button class="chip active" data-category="">All</button>
      </div>
    </div>

    <div class="results-head">
      <h2 id="resultsTitle">All places</h2>
      <span id="resultsCount" class="results-count"></span>
    </div>
    <div id="placesGrid" class="place-grid"></div>
    <div id="emptyState" class="empty-state hidden">No places match that search yet.</div>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
