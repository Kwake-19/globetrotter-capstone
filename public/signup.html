<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up · GlobeTrotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<header class="site-header" id="siteHeader"></header>

<main class="auth-page">
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-card__sub">Save places and build shareable Yaoundé itineraries.</p>

      <div id="formError" class="form-error hidden"></div>

      <form id="signupForm" class="auth-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" required />
          <div class="field__error" id="nameError"></div>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required />
          <div class="field__error" id="usernameError"></div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
          <div class="field__error" id="emailError"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" required />
          <div class="field__error" id="passwordError"></div>
        </div>
        <div class="field">
          <label for="phone">Phone number <span class="field__hint">(optional)</span></label>
          <input type="tel" id="phone" autocomplete="tel" />
        </div>
        <div class="field">
          <label for="homeCity">Home city / neighborhood <span class="field__hint">(optional)</span></label>
          <input type="text" id="homeCity" autocomplete="address-level2" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign up</button>
      </form>
    </div>
    <p class="auth-switch">Already have an account? <a class="link-btn" href="/login.html">Log in</a></p>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/signup.js"></script>
</body>
</html>
