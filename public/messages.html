<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messages · GlobeTrotter</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<header class="site-header" id="siteHeader"></header>

<main>
  <div class="container">
    <div class="messages-layout" id="messagesLayout">
      <aside class="conversation-pane">
        <div class="conversation-pane__head">
          <h1>Messages</h1>
          <button id="newMessageBtn" class="btn btn-outline btn-sm">New</button>
        </div>
        <div id="newMessagePicker" class="friend-picker hidden"></div>
        <div id="conversationList" class="conversation-list"></div>
      </aside>

      <section class="chat-pane">
        <div class="chat-pane__empty" id="chatEmpty">Select a conversation, or start a new one.</div>
        <div class="chat-pane__active hidden" id="chatActive">
          <div class="chat-pane__head">
            <button class="link-btn chat-back" id="chatBackBtn">‹ Conversations</button>
            <span class="chat-pane__title" id="chatTitle"></span>
          </div>
          <div class="chat-thread" id="chatThread"></div>
          <form class="chat-compose" id="chatCompose">
            <input type="text" id="chatInput" placeholder="Write a message…" autocomplete="off" maxlength="2000" />
            <button type="submit" class="btn btn-primary btn-sm">Send</button>
          </form>
          <div class="chat-error field__error" id="chatError"></div>
        </div>
      </section>
    </div>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js"></script>
<script src="/js/messages.js"></script>
</body>
</html>
