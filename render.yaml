# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render "New +" -> "Blueprint",
# point it at the repo. Render builds src/../Dockerfile and reads this file
# for everything else.
#
# IMPORTANT (free tier): Render's free web services have an EPHEMERAL
# filesystem - data/db.json resets to whatever's baked into the image
# (the seed destinations) on every redeploy, restart, or scale-to-zero.
# Fine for a demo; if you need signups/itineraries to actually persist,
# either upgrade to a paid Render plan with a persistent disk, or deploy
# somewhere with real persistent storage instead (see README).
services:
  - type: web
    name: globetrotter-monolith
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DB_FILE
        value: ./data/db.json
      - key: CORS_ORIGIN
        value: "*"
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_MAPS_EMBED_KEY
        sync: false
